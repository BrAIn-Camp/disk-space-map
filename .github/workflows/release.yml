name: Build exe

# Push a version tag to build DiskSpaceMap.exe and attach it to a GitHub release:
#   git tag v1.0.1 && git push origin v1.0.1
# "Run workflow" on the Actions tab builds it without releasing; the exe is
# then under the run's artifacts.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build
        run: |
          python -m pip install pyinstaller==6.22.3
          pyinstaller --onefile --name DiskSpaceMap --add-data "disk-usage.html;." scan_disk.py

      - name: Smoke test
        run: |
          $drive = $env:GITHUB_WORKSPACE.Substring(0, 2)
          ./dist/DiskSpaceMap.exe $drive --no-open --out $env:RUNNER_TEMP
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $page = Join-Path $env:RUNNER_TEMP "disk-map-$($drive[0]).html"
          if (-not (Select-String -Path $page -Pattern 'window.DISK_DATA = {' -SimpleMatch -Quiet)) {
            throw "No scan data in $page"
          }

      - uses: actions/upload-artifact@v7
        with:
          name: DiskSpaceMap
          path: dist/DiskSpaceMap.exe

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/DiskSpaceMap.exe --title $env:GITHUB_REF_NAME --generate-notes
